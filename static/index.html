<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noa Auto</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app">
  <div class="path-row">
    <label>Game Path:</label>
    <input type="text" id="path-input" placeholder="D:/path/to/game.exe">
    <button id="browse-btn">Browse</button>
  </div>

  <div class="control-row">
    <label>Status:</label>
    <span id="status-label" class="status-idle">IDLE</span>
    <button id="start-btn" class="btn-start">&#9654; Start</button>
    <button id="stop-btn" class="btn-stop" disabled>&#9632; Stop</button>
  </div>

  <div class="chain-section">
    <div class="chain-column">
      <label>Available Routines</label>
      <div id="available-list" class="chain-list"></div>
    </div>
    <div class="chain-column">
      <label>Active Chain</label>
      <div id="chain-list" class="chain-list"></div>
    </div>
  </div>

  <div class="repeat-row">
    <label>Repeat:</label>
    <input type="number" id="repeat-input" min="1" value="1">
  </div>

  <div class="log-section">
    <label>Log</label>
    <pre id="log-console"></pre>
  </div>
</div>

<div id="browse-modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <span id="browse-title">Select Executable</span>
      <button id="browse-close">&times;</button>
    </div>
    <div id="browse-parent" class="browse-nav">
      <a href="#" id="browse-up">&#8593; Parent folder</a>
    </div>
    <div id="browse-list"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
